baseURL = 'https://seeck.github.io'
copyright = "2026-{year} ShelfSeeck "
languageCode = 'zh-CN'
defaultContentLanguage = 'cn'
theme = 'enchanted-lowkey'
title = "SEECK's House"
enableRobotsTXT = true
summaryLength = 20
paginate = 6


[markup]
  [markup.goldmark]
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.extras]
        [markup.goldmark.extensions.extras.mark]
          enable = true
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.renderHooks]
      [markup.goldmark.renderHooks.image]
        useEmbedded = 'always'
      [markup.goldmark.renderHooks.link]
        useEmbedded = 'always'

  [markup.highlight]
    anchorLineNos = false
    codeFences = true
    guessSyntax = false
    hl_Lines = ''
    hl_inline = false
    lineAnchors = ''
    lineNoStart = 1
    lineNos = false
    lineNumbersInTable = false
    noClasses = true
    noHl = false
    style = 'dracula'
    tabWidth = 4
